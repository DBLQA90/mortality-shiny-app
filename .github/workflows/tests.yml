name: Tests

# Unit tests and the end-to-end smoke test on every push and pull request.
#
# Both run on the committed snapshots in data/ and make no network calls, so
# they work on GitHub's hosted runners - unlike the data refresh, which INE
# blocks there (see refresh-snapshots.yml).
#
# The invariant sweep (tools/invariant_sweep.R) is not run here: it takes
# minutes rather than seconds and checks the data more than the code. It runs
# after every scheduled refresh, and can be started by hand from the Actions
# tab (workflow_dispatch, input `sweep`).

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sweep:
        description: "Also run the invariant sweep"
        type: boolean
        default: false

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MORTALITY_INSTALL_MISSING_PACKAGES: "false"
      MORTALITY_DEFAULT_DATA_SOURCE: snapshot
      TESTTHAT_REPORTER: check

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # The R version recorded in renv.lock.
          r-version: renv
          use-public-rspm: true

      # Libraries some packages build against (gdtools, for flextable, needs
      # cairo and freetype), for any package Posit has no binary of.
      - name: System libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libcairo2-dev libfreetype6-dev libfontconfig1-dev libharfbuzz-dev \
            libfribidi-dev libpng-dev libjpeg-dev libtiff5-dev libcurl4-openssl-dev libssl-dev libxml2-dev
          # renv.lock names CRAN, which serves sources; take the same versions
          # as binaries for this runner's Ubuntu from Posit's package manager.
          echo "RENV_CONFIG_REPOS_OVERRIDE=https://packagemanager.posit.co/cran/__linux__/$(lsb_release -cs)/latest" >> "$GITHUB_ENV"

      # The exact package versions of renv.lock, the ones the app and the tests
      # were verified against locally, so CI fails on our changes rather than
      # on a new CRAN release. Binaries come from Posit's public package
      # manager (set above); the restored library is cached by lockfile. Regenerate the lockfile as the README says.
      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      # The project does not auto-activate renv, so point the next steps at the
      # library it restored.
      - name: Use the restored library
        run: echo "R_LIBS_USER=$(Rscript -e 'cat(renv::paths$library(project = getwd()))')" >> "$GITHUB_ENV"

      - name: Package versions
        run: Rscript -e 'for (p in c("shiny", "forecast", "plotly", "dplyr", "testthat")) cat(p, as.character(packageVersion(p)), "\n")'

      - name: Unit tests
        run: Rscript run_tests.R

      - name: Smoke test (Shiny server)
        run: Rscript tests/smoke_app.R

      - name: Invariant sweep
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sweep }}
        run: Rscript tools/invariant_sweep.R --report=invariant-sweep.txt

      - name: Upload sweep report
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.sweep }}
        uses: actions/upload-artifact@v4
        with:
          name: invariant-sweep
          path: invariant-sweep.txt
          if-no-files-found: ignore
